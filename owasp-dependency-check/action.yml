name: 'Dependency Check'
description: 'Github action to execute dependency check with BOM generation'
inputs:
  project:
    description: 'The project name'
    required: true
  path:
    description: 'The path to the project'
    required: true  
  format:
    description: "The report format. To generate bom.xml, set this to 'ALL' or 'CycloneDX'."
    required: true
  out:
    description: 'The output directory'
    required: false 
    default: 'reports'
  args:
    description: 'The arguments to pass to the dependency check'
    required: false




runs:
  using: 'composite'
  steps:
    - name: Run OWASP Dependency-Check
      shell: bash
      run: |
        # Use the specialized image with the nightly database
        IMAGE="owasp/dependency-check-action:latest"
        
        FORMAT_ARGS=""
        for fmt in ${{ inputs.format }}; do
          FORMAT_ARGS="$FORMAT_ARGS --format $fmt"
        done

        docker run --rm \
          -v ${{ github.workspace }}:/src \
          $IMAGE \
          --project "${{ inputs.project }}" \
          --scan "/src/${{ inputs.path }}" \
          --out "/src/${{ inputs.out }}" \
          --noupdate \
          $FORMAT_ARGS \
          ${{ inputs.args }}