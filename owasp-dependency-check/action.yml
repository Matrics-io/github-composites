name: 'Dependency Check'
description: 'Github action to execute dependency check with BOM generation'
inputs:
  project:
    description: 'The project name'
    required: true
  path:
    description: 'The path to the project'
    required: true  
  format:
    description: "The report format(s). Example: 'XML CycloneDX'."
    required: true
  out:
    description: 'The output directory'
    required: false 
    default: 'reports'
  args:
    description: 'The arguments to pass to the dependency check'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run OWASP Dependency-Check
      shell: bash
      run: |
        IMAGE="owasp/dependency-check-action:latest"

        FORMAT_ARGS=""
        for fmt in ${{ inputs.format }}; do
          FORMAT_ARGS="$FORMAT_ARGS --format $fmt"
        done

        docker run --rm \
          -v ${{ github.workspace }}:/src \
          $IMAGE \
          --project "${{ inputs.project }}" \
          --scan "/src/${{ inputs.path }}" \
          --out "/src/${{ inputs.out }}" \
          --noupdate \
          $FORMAT_ARGS \
          ${{ inputs.args }}

        # If CycloneDX was requested, normalize its filename to bom.xml
        if [ -f "${{ github.workspace }}/${{ inputs.out }}/dependency-check-report.cyclonedx.xml" ]; then
          mv "${{ github.workspace }}/${{ inputs.out }}/dependency-check-report.cyclonedx.xml" \
             "${{ github.workspace }}/${{ inputs.out }}/bom.xml"
        fi
